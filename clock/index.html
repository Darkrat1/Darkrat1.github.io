<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rat's Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="clock">00:00:00</div>
  <div id="date">Loading...</div>

  <!-- Settings Button -->
  <button id="settings-btn">⚙️</button>

  <!-- Settings Panel -->
<!-- Overlay -->
<div id="settings-overlay" class="hidden">
  <div id="settings-panel">
    <h2>Settings</h2>

    <div class="setting-group">
      <label>Theme</label>
      <select id="theme-select">
        <option value="seasonal">Seasonal</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>

    <div class="setting-inline">
      <input type="checkbox" id="toggle-date" checked>
      <label for="toggle-date">Show Date</label>
    </div>

    <div class="setting-inline">
      <input type="checkbox" id="toggle-seconds" checked>
      <label for="toggle-seconds">Show Seconds</label>
    </div>

    <div class="setting-group">
      <label>Time Font</label>
      <select id="time-font">
        <option value="'Arial Black', Arial, sans-serif">Default</option>
        <option value="Verdana, sans-serif">Verdana</option>
        <option value="'Courier New', monospace">Courier</option>
        <option value="'Trebuchet MS', sans-serif">Trebuchet</option>
      </select>
    </div>

    <div class="setting-group">
      <label>Date Font</label>
      <select id="date-font">
        <option value="'Arial Black', Arial, sans-serif">Default</option>
        <option value="Verdana, sans-serif">Verdana</option>
        <option value="'Courier New', monospace">Courier</option>
        <option value="'Trebuchet MS', sans-serif">Trebuchet</option>
      </select>
    </div>

  </div>
</div>

  <script src="script.js"></script>
</body>
</html>
