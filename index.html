<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Starting Soon</title>

<style>

body{
margin:0;
background:transparent;
overflow:hidden;
font-family:Arial;
}


/* TEXT */

.starting{

position:absolute;
top:50%;
left:50%;

transform:translate(-50%,-50%);

color:#6fd3ff;

font-size:70px;

letter-spacing:6px;

text-shadow:
0 0 10px #6fd3ff,
0 0 40px #6fd3ff;

animation:pulse 2s infinite;

}

@keyframes pulse{
0%{opacity:.7;}
50%{opacity:1;}
100%{opacity:.7;}
}


/* DVD */

#dvd{

position:absolute;

width:160px;
height:80px;

display:flex;
align-items:center;
justify-content:center;

font-size:28px;
font-weight:bold;

border:3px solid white;
border-radius:12px;

color:white;

}


.cornerFlash{
animation:flash .4s;
}

@keyframes flash{
from{transform:scale(1.5);}
to{transform:scale(1);}
}

</style>
</head>

<body>


<div id="dvd">DVD</div>

<div class="starting">
STARTING SOON
</div>



<script>

let dvd=document.getElementById("dvd");

let x=100;
let y=100;

let dx=5;   // Faster speed
let dy=5;

let startTime=Date.now();

let targetTime=150000; // 2:30

function randomColor(){

return "hsl("+Math.random()*360+",100%,60%)";

}


function animate(){

let w=window.innerWidth;
let h=window.innerHeight;

let logoW=dvd.offsetWidth;
let logoH=dvd.offsetHeight;

let elapsed=Date.now()-startTime;


/* Normal DVD motion */

x+=dx;
y+=dy;


/* Wall bounce */

if(x<=0||x+logoW>=w){

dx*=-1;

dvd.style.color=randomColor();
dvd.style.borderColor=randomColor();

}

if(y<=0||y+logoH>=h){

dy*=-1;

dvd.style.color=randomColor();
dvd.style.borderColor=randomColor();

}


/*
Near 2:30 guide logo to corner
*/

if(elapsed>130000){

let targetX=w-logoW;
let targetY=h-logoH;

x+=(targetX-x)*0.02;
y+=(targetY-y)*0.02;

}


/*
Perfect corner hit
*/

if(elapsed>=targetTime){

let targetX=w-logoW;
let targetY=h-logoH;

x=targetX;
y=targetY;

dvd.classList.add("cornerFlash");

dvd.style.color=randomColor();
dvd.style.borderColor=randomColor();

startTime=Infinity;

}


dvd.style.left=x+"px";
dvd.style.top=y+"px";


requestAnimationFrame(animate);

}

animate();


</script>


</body>
</html>
