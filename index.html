<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Starting Soon</title>

<style>

body {
    margin:0;
    background:black;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

/* Starting Soon Text */

.starting {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:70px;
    letter-spacing:6px;
    text-shadow:
        0 0 10px white,
        0 0 30px white;
    animation:pulse 2s infinite;
}

@keyframes pulse {
    0% {opacity:0.7;}
    50% {opacity:1;}
    100% {opacity:0.7;}
}


/* DVD Logo */

#dvd {
    position:absolute;
    width:160px;
    height:80px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;
    font-weight:bold;

    border:3px solid white;
    border-radius:12px;

    color:white;

    user-select:none;
}

.cornerFlash {
    animation:flash 0.3s;
}

@keyframes flash {
    from {transform:scale(1.4);}
    to {transform:scale(1);}
}

</style>
</head>

<body>

<div id="dvd">DVD</div>

<div class="starting">
STARTING SOON
</div>

<script>

let dvd = document.getElementById("dvd");

let x = 100;
let y = 100;

let dx = 3;
let dy = 3;

function randomColor() {

    return "hsl(" + Math.random()*360 + ",100%,60%)";

}

function animate() {

    let w = window.innerWidth;
    let h = window.innerHeight;

    let logoW = dvd.offsetWidth;
    let logoH = dvd.offsetHeight;

    x += dx;
    y += dy;

    let hitCorner = false;

    if (x <= 0 || x + logoW >= w) {
        dx *= -1;
        hitCorner = true;
    }

    if (y <= 0 || y + logoH >= h) {
        dy *= -1;
        hitCorner = true;
    }

    if(hitCorner){

        dvd.style.borderColor = randomColor();
        dvd.style.color = randomColor();

        dvd.classList.add("cornerFlash");

        setTimeout(()=>{
            dvd.classList.remove("cornerFlash");
        },300);

    }

    dvd.style.left = x + "px";
    dvd.style.top = y + "px";

    requestAnimationFrame(animate);

}

animate();

</script>

</body>
</html>
