<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Starting Soon</title>

<style>

body {
    margin:0;
    background:transparent; /* OBS Transparency */
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

/* STARTING TEXT */

.starting {

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    color:#6fd3ff; /* Light blue */

    font-size:70px;

    letter-spacing:6px;

    text-shadow:
        0 0 10px #6fd3ff,
        0 0 40px #6fd3ff;

    animation:pulse 2s infinite;

}

@keyframes pulse {
    0% {opacity:0.7;}
    50% {opacity:1;}
    100% {opacity:0.7;}
}



/* DVD */

#dvd {

    position:absolute;

    width:160px;
    height:80px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;
    font-weight:bold;

    border:3px solid white;
    border-radius:12px;

    color:white;

    user-select:none;

}

.cornerFlash{
    animation:flash 0.4s;
}

@keyframes flash {
    from {transform:scale(1.4);}
    to {transform:scale(1);}
}

</style>

</head>

<body>


<div id="dvd">
DVD
</div>


<div class="starting">
STARTING SOON
</div>


<script>

let dvd = document.getElementById("dvd");

let logoW = 160;
let logoH = 80;

let screenW = window.innerWidth;
let screenH = window.innerHeight;

/*
Goal:

Perfect corner hit after 150 seconds
*/

let targetTime = 150000; // 2m30s

let startTime = Date.now();

let targetX = screenW - logoW;
let targetY = screenH - logoH;

/*
Start top-left and calculate speed needed
*/

let x = 0;
let y = 0;

let dx = targetX / (targetTime/16);
let dy = targetY / (targetTime/16);


function randomColor(){
    return "hsl(" + Math.random()*360 + ",100%,60%)";
}


function animate(){

    let now = Date.now();

    let elapsed = now - startTime;

    /*
    Normal movement
    */

    x += dx;
    y += dy;

    /*
    Check for target corner time
    */

    if(elapsed >= targetTime){

        x = targetX;
        y = targetY;

        dvd.style.borderColor = randomColor();
        dvd.style.color = randomColor();

        dvd.classList.add("cornerFlash");

        dx *= -1;
        dy *= -1;

        startTime = Infinity;

    }


    /*
    Normal bouncing after that
    */

    if(x <= 0 || x + logoW >= screenW){

        dx *= -1;

        dvd.style.borderColor = randomColor();
        dvd.style.color = randomColor();

    }

    if(y <= 0 || y + logoH >= screenH){

        dy *= -1;

        dvd.style.borderColor = randomColor();
        dvd.style.color = randomColor();

    }


    dvd.style.left = x + "px";
    dvd.style.top = y + "px";


    requestAnimationFrame(animate);

}


animate();


</script>


</body>
</html>
