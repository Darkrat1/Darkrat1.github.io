<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DarkRat1 Tools</title>
  <style>
    body {
      background-color: #121212;
      color: #eee;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      margin-top: 3rem;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    nav {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    a.button {
      background-color: #1f1f1f;
      border: 2px solid #444;
      color: #fff;
      text-decoration: none;
      padding: 1rem 2rem;
      font-size: 1.25rem;
      border-radius: 8px;
      transition: 0.2s;
      text-align: center;
    }
    a.button:hover {
      background-color: #222;
      border-color: #777;
    }
    footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>
<body>

  <header>
    <h1>Cool Websites I made</h1>
  </header>

  <nav>
    <a class="button" href="./Calender/">📅 Calendar</a>
    <a class="button" href="./timer/">⏱ Timer</a>
    <a class="button" href="./clock/">🕒 Clock</a>
  </nav>

  <footer>
    &copy; 2026 darkrat1.github.io
  </footer>

</body>
</html>
