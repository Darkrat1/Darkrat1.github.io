<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="mode">
    <button id="mode-btn">Mode: Timer</button>
  </div>

  <!-- Clickable / editable time -->
  <div id="time" contenteditable="true">00:05:00</div>

  <div class="controls">
    <button id="start">Start</button>
    <button id="pause">Pause</button>
    <button id="reset">Reset</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
